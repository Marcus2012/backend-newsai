# Google Cloud Build Configuration
# Deploys to Cloud Run automatically on push to main branch
# Documentation: https://cloud.google.com/build/docs

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/newsai-backend:latest'
      - '.'
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/newsai-backend:latest'
    waitFor: ['build-image']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/newsai-backend:latest'
    waitFor: ['build-image']

  # Step 3: Deploy using gcloud run deploy
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-cloud-run'
    args:
      - 'run'
      - 'deploy'
      - 'newsai-backend'
      - '--image=gcr.io/$PROJECT_ID/newsai-backend:latest'
      - '--region=us-east4'
      - '--platform=managed'
      - '--memory=1Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--max-instances=10'
      - '--min-instances=0'
      - '--concurrency=10'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances=asieselfutbol:us-east4:newsai'
      - "--set-env-vars=PYTHONUNBUFFERED=1,PLAYWRIGHT_BROWSERS_PATH=/ms-playwright"
      - "--update-secrets=DATABASE_URL=DATABASE_URL:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,GROQ_API_KEY=GROQ_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,WP_AUTH_TOKEN=WP_AUTH_TOKEN:latest,SPORTMONKS_API_TOKEN=SPORTMONKS_API_TOKEN:latest,STRAPI_URL=STRAPI_URL:latest,STRAPI_TOKEN=STRAPI_TOKEN:latest,EASYPROMOS_API_TOKEN=EASYPROMOS_API_TOKEN:latest,EASYPROMOS_CAMPAIGN_ID=EASYPROMOS_CAMPAIGN_ID:latest,EASYPROMOS_API_AUTLOGIN=EASYPROMOS_API_AUTLOGIN:latest,EASYPROMOS_PROMO_BASE=EASYPROMOS_PROMO_BASE:latest"
      - "--remove-secrets=STRAPI_DEV_URL,STRAPI_DEV_TOKEN"
    waitFor: ['push-latest']

# Images to be pushed to the registry
images:
  - 'gcr.io/$PROJECT_ID/newsai-backend:latest'

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
  
# Timeout for the build
timeout: '1800s'

# Trigger settings (configure in Cloud Build UI)
# This will run on:
# - Pushes to 'main' branch
# - Pull requests to 'main' branch (optional)
