# Google Cloud Run Configuration
# This configuration is used for deploying to Google Cloud Run
# Documentation: https://cloud.google.com/run/docs/quickstarts/build-and-deploy

# Project and service configuration
runtime: python311
entrypoint: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080

# Environment variables (these can be overridden via gcloud CLI or Cloud Console)
env_variables:
  # These should be set as Secrets in Google Cloud:
  # - DATABASE_URL
  # - GEMINI_API_KEY
  # - GROQ_API_KEY
  # - SECRET_KEY
  # - WP_AUTH_TOKEN
  # - FOOTYSTATS_API_KEY
  UVICORN_TIMEOUT_KEEP_ALIVE: "65"

# Resource allocation
# Cloud Run automatically scales to 0 when not in use
# Adjust based on your traffic patterns
max_instances: 100
min_instances: 1

# Concurrency: number of concurrent requests a single container instance can handle
concurrency: 80

# Cloud Run settings
# Memory is allocated to the service (default: 256Mi)
# For CPU: 1 CPU = 1, 2 CPUs = 2 (Cloud Run standard)
cpu: 2
memory: 1Gi
timeout: 3600
